name: CI

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check desktop
      run: npx tsc --noEmit -p apps/desktop/tsconfig.main.json --ignoreDeprecations 6.0

    - name: Run tests
      run: |
        echo "No tests configured yet"

  package:
    needs: build
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Clear npm cache
      run: npm cache clean --force

    - name: Install dependencies
      run: npm ci

    - name: Debug desktop files
      working-directory: apps/desktop
      run: |
        echo "Current directory:"
        pwd
        echo "Files in apps/desktop:"
        dir
        echo "Files in src/renderer:"
        dir src\renderer
        echo "vite.config.js content:"
        type vite.config.js
        echo "package.json scripts:"
        type package.json | findstr scripts

    - name: Build desktop
      run: npm run build --workspace desktop

    - name: Package
      run: npm run package:win --workspace desktop

    - name: Generate SHA256 checksums
      run: |
        cd apps/desktop
        Get-ChildItem release/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File release/SHA256SUMS.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: phone-toolkit-installer
        path: |
          apps/desktop/release/*.exe
          apps/desktop/release/SHA256SUMS.txt